<!DOCTYPE html>
<html lang="ko">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 카드</title>
    <!-- Custom StyleSheet -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

    <!--Noto Sans-->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"

<body>

    <!--프로필 카드 01-->
    <div class="profile-card-wrapper">
        <div class="profile-card" id="profile-card-01">
            <!--프로필 사진-->
            <div class="profile-img-wrapper">
                <img class="profile-img" src="images/profile.png" alt="내 프로필 사진">
            </div>

            <!--카드 본문-->
            <div class="profile-card-body">
                <h1 class="name">Ray Kim</h1>
                <p class="job-title">Web developer</p>
                <p class="company"><i class="fa-solid fa-building"></i>김씨의 코딩 연습소</p>

                <ul class="info-list">
                    <li><i class="fa-solid fa-envelope"></i>
                        example@gmail.com</li>
                    <li><i class="fa-solid fa-phone"></i> 010-1234-5678</li>
                    <li>
                        <i class="fa-solid fa-location-dot"></i> 서울, 대한민국
                    </li>
                </ul>

                <!--소셜 아이콘-->
                <div class="social-link">
                    <a href="#" target="_blank" aria-label="GitHub" rel="noopener"><i
                            class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-kakao-talk" rel="noopener noreferrer"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f" rel="noopener noreferrer"></i></a>
                    <a href=""><i class="fa-brands fa-instagram" rel="noopener noreferrer"></i></a>
                </div>

                <!--연락 버튼-->
                <a href="mailto:example@gmail.com" class="btn-contact">
                    <i class="fa-solid fa-paper-plane"></i>연락하기
                </a>
            </div>

        </div>
